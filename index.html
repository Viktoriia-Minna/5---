<!DOCTYPE html>
<html lang="uk">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Клавіша та продажі</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pnotify/3.2.1/pnotify.css" />
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<main class="page-shell">
			<section class="game-section" aria-labelledby="game-title">
				<div class="section-heading">
					<h2 id="game-title">Натисни правильну клавішу</h2>
				</div>
				<div class="game-panel">
					<p id="message" class="game-message" aria-live="polite">Натисни клавішу, яка показана нижче.</p>
					<div class="key-display" aria-live="polite">
						<span class="key-label">Твоя клавіша</span>
						<strong id="key">A</strong>
					</div>
					<button id="new-game" class="primary-button" type="button">Нова гра</button>
				</div>
			</section>

			<section class="chart-section" aria-labelledby="chart-title">
				<div class="section-heading">
					<h2 id="chart-title">Продажі за останній місяць</h2>
				</div>
				<div class="chart-panel">
					<canvas id="sales-chart"></canvas>
				</div>
			</section>
		</main>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/pnotify/3.2.1/pnotify.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
		<script src="javaskript.js"></script>
	</body>
</html>
